<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshCore RX Monitor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-row">
                <span class="app-title">MeshCore RX Monitor</span>
                <div class="header-controls">
                    <span id="status" class="status disconnected">Disconnected</span>
                    <button id="connectBtn" class="btn-primary">Connect Bluetooth</button>
                    <label class="sound-toggle"><input type="checkbox" id="soundEnabled"> Sound</label>
                </div>
                <span id="batteryStatus" class="battery-status hidden"></span>
                <div id="savedDevices" class="saved-devices hidden"></div>
            </div>
            <div class="header-stats-row">
                <div class="header-stats">
                    <span class="hstat"><span class="hstat-label">Active</span> <span id="activeHashes">0</span></span>
                    <span class="hstat"><span class="hstat-label">Total RX</span> <span id="totalRx">0</span></span>
                    <span class="hstat"><span class="hstat-label">Repeaters</span> <span id="totalRepeaters">0</span></span>
                </div>
            </div>
        </header>

        <main>
            <div id="emptyState" class="empty-state">
                <p>Connect to a MeshCore companion device via Bluetooth to start monitoring RX logs.</p>
            </div>

            <div class="section-wrap" id="repeaterWrap">
                <div class="section-header">
                    <span class="section-title">Seen repeaters</span>
                    <button class="collapse-btn" data-target="repeaterBody" title="Toggle section">▾</button>
                </div>
                <div class="section-body" id="repeaterBody">
                    <div class="repeater-log-scroll">
                        <table class="repeater-log-table">
                            <thead><tr>
                                <th data-sort-key="id">Repeater</th>
                                <th data-sort-key="count">RX</th>
                                <th data-sort-key="maxRssi">Max RSSI</th>
                                <th data-sort-key="lastRssi">Last RSSI</th>
                                <th data-sort-key="maxSnr">Max SNR</th>
                                <th data-sort-key="lastSnr">Last SNR</th>
                                <th data-sort-key="lastSeen" class="sort-desc">Last seen</th>
                            </tr></thead>
                            <tbody id="repeaterLogBody"></tbody>
                        </table>
                    </div>
                </div>
                <label class="ttl-control">
                    <span class="ttl-label">Auto-remove data below after</span>
                    <select id="ttlSelect">
                        <option value="30">30 seconds</option>
                        <option value="60">1 minute</option>
                        <option value="120">2 minutes</option>
                        <option value="300" selected>5 minutes</option>
                        <option value="600">10 minutes</option>
                        <option value="900">15 minutes</option>
                        <option value="1800">30 minutes</option>
                        <option value="3600">1 hour</option>
                        <option value="Infinity">Never</option>
                    </select>
                </label>
            </div>

            <div class="section-wrap hidden" id="rssiChartWrap">
                <div class="section-header">
                    <span class="section-title">Repeaters RSSI history</span>
                    <button class="collapse-btn" data-target="rssiChartBody" title="Toggle section">▾</button>
                </div>
                <div class="section-body" id="rssiChartBody">
                    <div class="chart-box">
                        <svg id="rssiChart" class="rssi-chart"></svg>
                        <div id="rssiChartLegend" class="chart-legend"></div>
                    </div>
                </div>
            </div>

            <div class="section-wrap hidden" id="snrChartWrap">
                <div class="section-header">
                    <span class="section-title">Repeaters SNR history</span>
                    <button class="collapse-btn" data-target="snrChartBody" title="Toggle section">▾</button>
                </div>
                <div class="section-body" id="snrChartBody">
                    <div class="chart-box">
                        <svg id="snrChart" class="rssi-chart"></svg>
                        <div id="snrChartLegend" class="chart-legend"></div>
                    </div>
                </div>
            </div>

            <div class="section-wrap" id="msgTableWrap">
                <div class="section-header">
                    <span class="section-title">Messages</span>
                    <button class="collapse-btn" data-target="msgScrollBody" title="Toggle section">▾</button>
                </div>
                <div class="section-body" id="msgScrollBody">
                    <div class="msg-table-scroll">
                        <table class="msg-table">
                            <thead id="msgTableHead"></thead>
                            <tbody id="msgTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="chartTooltip" class="chart-tooltip"></div>
    <script type="module" src="app.js"></script>
</body>
</html>
